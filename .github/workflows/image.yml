name: Imagen INVOIX

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/invoix

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}

      - name: Avisar al panel
        env:
          PANEL_WEBHOOK_SECRET: ${{ secrets.PANEL_WEBHOOK_SECRET }}
          PANEL_WEBHOOK_URL: ${{ secrets.PANEL_WEBHOOK_URL }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          body=$(jq -nc --arg image "${IMAGE}:${SHA}" '{image:$image}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$PANEL_WEBHOOK_SECRET" | awk '{print $2}')
          curl -fsS -X POST "$PANEL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${sig}" \
            -d "$body"
